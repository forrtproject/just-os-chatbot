<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary Item Grading</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8;
  --accent: #2f5d8a; --accent-text: #ffffff; --done: #2e7d4f; --warn: #a15c00; --soft: #eef2f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161716; --panel: #1f201f; --text: #e8e8e4; --muted: #a0a09a; --line: #353633;
    --accent: #7fb0e0; --accent-text: #111; --done: #6cc28f; --warn: #e0a64f; --soft: #252a30;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
.tabs button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.spacer { flex: 1; }
.progress { color: var(--muted); font-size: 13px; }
main { max-width: 920px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.question { font-size: 18px; font-weight: 600; margin: 4px 0 10px; }
.definition, .answer { background: var(--soft); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
.answer + .label, .question + .label { margin-top: 14px; }
.explain { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.explain b { color: var(--text); }
.card.source { border-left: 4px solid var(--muted); }
.term { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
details summary { cursor: pointer; color: var(--muted); }
.row { border-top: 1px solid var(--line); padding: 12px 0; }
.row:first-of-type { border-top: 0; }
.criterion { margin-bottom: 8px; }
.type { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.choices button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.row.next { box-shadow: inset 3px 0 0 var(--warn); padding-left: 10px; }
label.check { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--muted); font-size: 14px; }
textarea, input[type=text] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--panel); color: var(--text); }
textarea { min-height: 54px; }
nav.pager { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 0; }
.dots button { width: 26px; height: 26px; font-size: 11px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; padding: 0; }
.dots button.done { background: var(--done); border-color: var(--done); color: #fff; }
.dots button.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.help { color: var(--muted); font-size: 14px; }
.help b { color: var(--text); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Glossary item grading</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-part="1">Part 1: items</button>
    <button role="tab" data-part="2">Part 2: answers</button>
  </div>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <button class="btn" id="export">Export CSV</button>
  <button class="btn" id="backup">Save backup</button>
  <label class="btn">Load backup<input type="file" id="restore" accept=".json" hidden></label>
</header>
<main>
  <div class="card help" id="help"></div>
  <div class="card">
    <label for="grader" class="meta">Your name or initials (goes into the export)</label>
    <input type="text" id="grader">
  </div>
  <div id="view"></div>
  <nav class="pager card">
    <button class="btn" id="prev">← Previous</button>
    <button class="btn primary" id="next">Next →</button>
    <button class="btn" id="nextOpen">Next unfinished</button>
    <div class="dots" id="dots"></div>
  </nav>
</main>
<script>
const DATA = /*DATA*/null;
const STORE = "glossary-grading-v1";
const SCALE = ["1 not at all", "2 barely", "3 partly", "4 mostly", "5 fully"];
const NEED = [["essential", "Essential"], ["nice", "Nice to have"], ["not", "Not needed"]];
const QOK = [["yes", "Yes"], ["partly", "Partly"], ["no", "No"]];
const HELP = {
  1: `<b>Part 1: is each item a good test?</b> Each item shows a FORRT glossary entry, then the question and the rubric a model wrote from it. For each question, say whether a researcher or student would ask it and whether it is clear on its own.
      For each rubric item, say whether a good answer to the question must cover it (<b>Essential</b>), would ideally cover it (<b>Nice to have</b>) or need not (<b>Not needed</b>),
      and tick <b>Not in the definition</b> when the glossary definition does not state it. The label core or detail is what the generator chose; judge the item yourself.`,
  2: `<b>Part 2: grade the answer as the LLM judge does.</b> For each rubric item, decide how fully the answer covers it, whatever the language of the answer:
      1 not at all, 2 barely, 3 partly, 4 mostly, 5 fully. Judge only what the answer says; citation markers such as [2] do not matter.
      Keys <kbd>1</kbd>–<kbd>5</kbd> score the next open rubric item, <kbd>←</kbd> <kbd>→</kbd> move between answers.`
};

let state = { part: 1, pos: { 1: 0, 2: 0 }, grader: "", p1: {}, p2: {} };
try { const saved = JSON.parse(localStorage.getItem(STORE)); if (saved) state = Object.assign(state, saved); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = () => (state.part === 1 ? DATA.part1 : DATA.part2);
const entryOf = (part, key) => {
  const store = part === 1 ? state.p1 : state.p2;
  return store[key] || (store[key] = part === 1 ? { q: "", r: {}, comment: "" } : { r: {}, comment: "" });
};
function done(part, e) {
  const g = (part === 1 ? state.p1 : state.p2)[e.key];
  if (!g) return false;
  return part === 1 ? g.q !== "" && e.rubric.every((r) => g.r[r.id] && g.r[r.id].need)
                    : e.rubric.every((r) => Number.isInteger(g.r[r.id]));
}

function choiceButtons(options, current, attrs) {
  return `<div class="choices">${options.map(([v, label]) =>
    `<button ${attrs} data-v="${v}" class="${String(current) === String(v) ? "on" : ""}">${label}</button>`).join("")}</div>`;
}

function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(+b.dataset.part === state.part)));
  $("help").innerHTML = HELP[state.part];
  $("grader").value = state.grader;
  const items = list(), pos = Math.min(state.pos[state.part], items.length - 1), e = items[pos];
  const g = entryOf(state.part, e.key);
  let html = `<p class="meta">${state.part === 1 ? "Item" : "Answer"} ${pos + 1} of ${items.length} · ${e.key}</p>`;
  if (state.part === 1) {
    html += `<div class="card source"><div class="label">Source given to the model: FORRT glossary entry</div>
      <div class="term">${esc(e.term)}</div><div class="definition">${esc(e.definition)}</div></div>
      <div class="card"><div class="label">Question a model wrote from this entry</div>
      <div class="question">${esc(e.question)}</div>
      <p class="meta">Would a researcher or student ask this, and is it clear on its own?</p>
      ${choiceButtons(QOK, g.q, 'data-q="1"')}</div>
      <div class="card"><div class="label">Rubric the model wrote for this question: what a good answer must cover</div>
      <p class="explain">A rubric is the checklist used to grade an answer to the question above. Each item is one point a good answer should make, and answers from the JUST-OS chatbot are later scored by how fully they cover each item. The model labelled each item <b>core</b>, a point the answer cannot leave out, or <b>detail</b>, a point a complete answer adds. For each item, judge whether an answer to this question should cover it, whatever its label.</p>`;
    let marked = false;
    e.rubric.forEach((r) => {
      const rg = g.r[r.id] || {};
      const next = !marked && !rg.need; if (next) marked = true;
      html += `<div class="row${next ? " next" : ""}"><div class="criterion"><span class="type">${esc(r.type)}</span>${esc(r.criterion)}</div>
        ${choiceButtons(NEED, rg.need || "", `data-need="${r.id}"`)}
        <label class="check"><input type="checkbox" data-notdef="${r.id}" ${rg.notdef ? "checked" : ""}> Not in the definition</label></div>`;
    });
  } else {
    html += `<div class="card"><div class="label">Question asked to the bot</div><div class="question">${esc(e.question)}</div>
      <div class="label">The bot's answer</div><div class="answer">${esc(e.answer)}</div></div>
      <div class="card"><div class="label">Rubric: how fully does the answer cover each point?</div>
      <p class="explain">The rubric is the checklist for the question above: each item is one point a good answer to it should make. Score how fully the bot's answer covers each item, from 1 (not at all) to 5 (fully).</p>`;
    let marked = false;
    e.rubric.forEach((r) => {
      const v = g.r[r.id];
      const next = !marked && !Number.isInteger(v); if (next) marked = true;
      html += `<div class="row${next ? " next" : ""}"><div class="criterion">${esc(r.id)}: ${esc(r.criterion)}</div>
        ${choiceButtons(SCALE.map((l, i) => [i + 1, l]), Number.isInteger(v) ? v : "", `data-score="${r.id}"`)}</div>`;
    });
  }
  html += `<p class="meta">Comment (optional)</p><textarea id="comment">${esc(g.comment || "")}</textarea></div>`;
  $("view").innerHTML = html;

  const count = items.filter((x) => done(state.part, x)).length;
  $("progress").textContent = `${count} of ${items.length} done in part ${state.part}`;
  $("dots").innerHTML = items.map((x, i) =>
    `<button data-go="${i}" class="${done(state.part, x) ? "done" : ""} ${i === pos ? "current" : ""}" title="${x.key}">${i + 1}</button>`).join("");
}

function current() { const items = list(); return items[Math.min(state.pos[state.part], items.length - 1)]; }
function go(i) { state.pos[state.part] = Math.max(0, Math.min(list().length - 1, i)); save(); render(); window.scrollTo(0, 0); }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  const e = current(), g = entryOf(state.part, e.key);
  if (t.dataset.part) { state.part = +t.dataset.part; save(); render(); return; }
  if (t.dataset.go) { go(+t.dataset.go); return; }
  if (t.dataset.q) g.q = t.dataset.v;
  else if (t.dataset.need) { (g.r[t.dataset.need] ||= {}).need = t.dataset.v; }
  else if (t.dataset.score) g.r[t.dataset.score] = +t.dataset.v;
  else return;
  save(); render();
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.notdef) { const g = entryOf(1, current().key); (g.r[t.dataset.notdef] ||= {}).notdef = t.checked; save(); render(); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "comment") { entryOf(state.part, current().key).comment = ev.target.value; save(); }
  if (ev.target.id === "grader") { state.grader = ev.target.value; save(); }
});
document.addEventListener("keydown", (ev) => {
  if (["TEXTAREA", "INPUT"].includes(document.activeElement.tagName)) return;
  if (ev.key === "ArrowRight") go(state.pos[state.part] + 1);
  else if (ev.key === "ArrowLeft") go(state.pos[state.part] - 1);
  else if (state.part === 2 && /^[1-5]$/.test(ev.key)) {
    const e = current(), g = entryOf(2, e.key), open = e.rubric.find((r) => !Number.isInteger(g.r[r.id]));
    if (open) { g.r[open.id] = +ev.key; save(); render(); }
  }
});
$("prev").onclick = () => go(state.pos[state.part] - 1);
$("next").onclick = () => go(state.pos[state.part] + 1);
$("nextOpen").onclick = () => {
  const items = list(), start = state.pos[state.part];
  for (let k = 1; k <= items.length; k++) { const i = (start + k) % items.length; if (!done(state.part, items[i])) return go(i); }
};

function csvLine(cells) { return cells.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(","); }
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("export").onclick = () => {
  const who = state.grader.trim() || "anonymous", stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "");
  const p1 = [csvLine(["grader", "key", "question_ok", "rubric_id", "generator_type", "need", "not_in_definition", "comment"])];
  DATA.part1.forEach((e) => { const g = state.p1[e.key]; if (!g) return;
    e.rubric.forEach((r) => { const rg = g.r[r.id] || {};
      p1.push(csvLine([who, e.key, g.q, r.id, r.type, rg.need || "", rg.notdef ? 1 : 0, g.comment])); }); });
  const p2 = [csvLine(["grader", "key", "rubric_id", "score", "comment"])];
  DATA.part2.forEach((e) => { const g = state.p2[e.key]; if (!g) return;
    e.rubric.forEach((r) => p2.push(csvLine([who, e.key, r.id, Number.isInteger(g.r[r.id]) ? g.r[r.id] : "", g.comment]))); });
  download(`grading_part1_${who}_${stamp}.csv`, p1.join("\n") + "\n", "text/csv");
  setTimeout(() => download(`grading_part2_${who}_${stamp}.csv`, p2.join("\n") + "\n", "text/csv"), 300);
};
$("backup").onclick = () => download(`grading_backup_${(state.grader.trim() || "anonymous")}.json`, JSON.stringify(state), "application/json");
$("restore").onchange = async (ev) => {
  const file = ev.target.files[0]; if (!file) return;
  try { state = Object.assign(state, JSON.parse(await file.text())); save(); render(); }
  catch (e) { alert("This file is not a grading backup."); }
};
render();
</script>
</body>
</html>
